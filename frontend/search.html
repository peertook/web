<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search · Peertook</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/video.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app-header"></div>

<main id="main" class="container" role="main">
  <header class="search-header">
    <h1 id="search-title">Search results</h1>
    <form class="search-page-form" id="page-search" role="search">
      <label class="sr-only" for="page-q">Search</label>
      <input id="page-q" type="search" placeholder="Search videos and channels" />
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
  </header>

  <section aria-labelledby="channels-title" id="channels-section" hidden>
    <div class="section-head"><h2 id="channels-title">Channels</h2></div>
    <div class="channel-list" id="channel-list"></div>
  </section>

  <section aria-labelledby="videos-title">
    <div class="section-head"><h2 id="videos-title">Videos</h2></div>
    <div class="video-grid" id="search-grid" aria-busy="true"></div>
    <div class="load-more-wrap">
      <button class="btn btn-ghost" id="load-more" type="button" hidden>Load more</button>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
