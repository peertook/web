<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Channel · Peertook</title>
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/video.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app-header"></div>

<main id="main" class="container" role="main">
  <section class="channel-header" id="channel-header" aria-busy="true"></section>

  <section aria-labelledby="channel-videos-title">
    <div class="section-head">
      <h2 id="channel-videos-title">Videos</h2>
    </div>
    <div class="video-grid" id="channel-grid" aria-busy="true"></div>
    <div class="load-more-wrap">
      <button class="btn btn-ghost" id="load-more" type="button" hidden>Load more</button>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
